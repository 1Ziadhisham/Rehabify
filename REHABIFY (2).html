<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>REHABIFY</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: one column — a real athlete on a glass "scanner" stage, the conversation under it, the composer docked at the bottom; coach & sources open as full panels */
:root{
  --bg-a:#E3F4F2; --bg-b:#E6EEFB; --blob1:#86E3D6; --blob2:#9BBEFF; --blob3:#C4F1E7;
  --glass:rgba(255,255,255,.56); --glass-2:rgba(255,255,255,.84); --glass-line:rgba(255,255,255,.78); --hair:rgba(10,50,70,.10);
  --shadow:0 18px 50px -20px rgba(18,70,100,.35);
  --ink:#0A2633; --muted:#466573; --soft:#6E8794;
  --teal:#0B958E; --blue:#2A6BE0; --grad:linear-gradient(135deg,#10B3A3 0%,#2A7BEA 100%);
  --red:#CF3439; --red-soft:rgba(229,72,77,.12); --amber:#9A6203; --amber-soft:rgba(212,138,6,.14); --green:#13804F; --green-soft:rgba(31,157,107,.13);
  --red-grad:linear-gradient(135deg,#FF6A6E,#D9363E); --amber-grad:linear-gradient(135deg,#FFC657,#F09A0B); --green-grad:linear-gradient(135deg,#2BCB94,#119E78);
  --display:"Alexandria","IBM Plex Sans Arabic",system-ui,sans-serif; --text:"IBM Plex Sans Arabic","Alexandria",system-ui,"Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg-a:#041218; --bg-b:#07132A; --blob1:#0D6A64; --blob2:#1E3F8F; --blob3:#0A4C47;
  --glass:rgba(14,30,42,.55); --glass-2:rgba(17,36,50,.9); --glass-line:rgba(255,255,255,.09); --hair:rgba(255,255,255,.09);
  --shadow:0 18px 50px -20px rgba(0,0,0,.7);
  --ink:#E3EFF4; --muted:#9BB3BF; --soft:#7891A0;
  --teal:#2DD4C2; --blue:#6EA6FF; --grad:linear-gradient(135deg,#14B8A6 0%,#3B82F6 100%);
  --red:#FF7378; --red-soft:rgba(255,107,112,.15); --amber:#F4BB4E; --amber-soft:rgba(242,181,68,.14); --green:#50D69D; --green-soft:rgba(76,212,154,.13);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg-a:#041218; --bg-b:#07132A; --blob1:#0D6A64; --blob2:#1E3F8F; --blob3:#0A4C47;
  --glass:rgba(14,30,42,.55); --glass-2:rgba(17,36,50,.9); --glass-line:rgba(255,255,255,.09); --hair:rgba(255,255,255,.09);
  --shadow:0 18px 50px -20px rgba(0,0,0,.7);
  --ink:#E3EFF4; --muted:#9BB3BF; --soft:#7891A0;
  --teal:#2DD4C2; --blue:#6EA6FF; --grad:linear-gradient(135deg,#14B8A6 0%,#3B82F6 100%);
  --red:#FF7378; --red-soft:rgba(255,107,112,.15); --amber:#F4BB4E; --amber-soft:rgba(242,181,68,.14); --green:#50D69D; --green-soft:rgba(76,212,154,.13);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:linear-gradient(160deg,var(--bg-a),var(--bg-b));color:var(--ink);font-family:var(--text);font-size:15px;line-height:1.6;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
a{color:var(--teal)}

.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.75}
.bg .b1{width:46vmax;height:46vmax;background:var(--blob1);top:-14vmax;inset-inline-start:-12vmax;animation:drift1 28s ease-in-out infinite alternate}
.bg .b2{width:40vmax;height:40vmax;background:var(--blob2);bottom:-16vmax;inset-inline-end:-10vmax;animation:drift2 32s ease-in-out infinite alternate}
.bg .b3{width:26vmax;height:26vmax;background:var(--blob3);top:38%;left:42%;opacity:.5;animation:drift1 36s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate(6vmax,4vmax) scale(1.08)}}
@keyframes drift2{to{transform:translate(-5vmax,-6vmax) scale(1.1)}}
.glass{background:var(--glass);border:1px solid var(--glass-line);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:var(--glass-2)}}

.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;max-width:920px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
header{display:flex;align-items:center;gap:10px;padding-block:12px 10px;flex:none;position:relative;z-index:6}
.brand{display:flex;align-items:center;gap:10px;min-width:0;border:0;background:none;padding:0;text-align:start}
.mark{width:38px;height:38px;border-radius:12px;background:var(--grad);display:grid;place-items:center;box-shadow:0 8px 20px -8px rgba(20,140,180,.7);flex:none}
.mark svg{width:20px;height:20px}
.brand b{display:block;font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:.08em;line-height:1.1}
.brand small{display:block;font-size:12px;color:var(--muted);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{margin-inline-start:auto;display:flex;align-items:center;gap:8px;flex:none}
.sos{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 13px;border-radius:999px;border:1px solid color-mix(in srgb,var(--red) 35%,transparent);background:var(--red-soft);color:var(--red);font-weight:700;font-family:var(--display);font-size:14px;transition:transform .2s,background .2s}
.sos:hover{transform:translateY(-1px);background:color-mix(in srgb,var(--red) 20%,transparent)}
.sos .dot{width:7px;height:7px;border-radius:50%;background:var(--red);animation:beat 1.8s infinite}
@keyframes beat{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--red) 60%,transparent)}70%,100%{box-shadow:0 0 0 8px transparent}}
.ibtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--glass-line);background:var(--glass);color:var(--ink);font-weight:700;font-family:var(--display);font-size:13px;transition:transform .2s;flex:none}
.ibtn:hover{transform:translateY(-1px)}
.ibtn svg{width:18px;height:18px}
@media (max-width:440px){.brand small{display:none}.sos .lbl{display:none}.tools{gap:6px}.ibtn{width:36px;height:36px}}
.menu{position:absolute;top:calc(100% - 2px);inset-inline-end:0;min-width:220px;border-radius:18px;padding:6px;display:grid;gap:2px;z-index:10;animation:pop .22s ease;background:var(--glass-2)}
.menu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:10px 12px;border-radius:12px;text-align:start;font-weight:500}
.menu button:hover{background:color-mix(in srgb,var(--teal) 12%,transparent)}
.menu svg{width:18px;height:18px;flex:none;color:var(--teal)}

main{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}
.stage{position:relative;flex:none;height:100%;min-height:0;border-radius:28px;overflow:hidden;
  background:radial-gradient(90% 70% at 50% 42%,color-mix(in srgb,var(--glass-2) 70%,transparent) 0%,transparent 70%),var(--glass)}
.stage.anim{transition:height .55s cubic-bezier(.3,.7,.2,1)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
#gl:active{cursor:grabbing}
.hero{position:absolute;top:18px;inset-inline:16px;text-align:center;pointer-events:none;transition:opacity .4s,transform .4s}
.hero.gone{opacity:0;transform:translateY(-8px)}
.hero h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(24px,4.4vw,36px);line-height:1.2;text-wrap:balance;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:6px auto 0;max-width:42ch;color:var(--muted);font-size:14px;text-wrap:balance}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px;pointer-events:none;transition:opacity .4s}
.loading.done{opacity:0}
.toolbar{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:5px;border-radius:999px;z-index:2}
.toolbar button{width:40px;height:40px;border:0;border-radius:50%;background:transparent;color:var(--ink);display:grid;place-items:center;transition:background .2s}
.toolbar button:hover{background:color-mix(in srgb,var(--teal) 14%,transparent)}
.toolbar svg{width:19px;height:19px}
.toolbar .sep{width:1px;background:var(--hair);margin:8px 2px}
.zlabel{position:absolute;top:12px;inset-inline-start:12px;padding:5px 12px 5px 10px;border-radius:999px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;z-index:2}
.zlabel i{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
.tip{position:absolute;pointer-events:none;padding:4px 11px;border-radius:999px;background:var(--ink);color:var(--bg-a);font-size:12.5px;font-weight:600;white-space:nowrap;transform:translate(-50%,-150%);opacity:0;transition:opacity .15s;z-index:3}
.tip.on{opacity:1}
.glfail{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}
.app.m-chat .hero{opacity:0;visibility:hidden}
.app.m-chat .toolbar{bottom:10px;left:auto;transform:none;inset-inline-end:10px;padding:3px}
.app.m-chat .toolbar button{width:34px;height:34px}
.app.m-chat .toolbar [data-act="rotL"],.app.m-chat .toolbar [data-act="rotR"],.app.m-chat .toolbar .sep{display:none}
.app:not(.m-chat) .zlabel{display:none}
.app:not(.m-expanded) [data-act="collapse"]{display:none}
.app:not(.m-chat) [data-act="expand"]{display:none}
.zpop{position:absolute;inset:10px;border-radius:22px;z-index:5;display:flex;flex-direction:column;overflow:hidden;animation:pop .28s cubic-bezier(.2,.8,.3,1)}
.zpop.glass{background:var(--glass-2);-webkit-backdrop-filter:blur(26px) saturate(160%);backdrop-filter:blur(26px) saturate(160%)}
.stage:has(.zpop:not([hidden])) .hero,.stage:has(.zpop:not([hidden])) .toolbar{visibility:hidden}
@keyframes pop{from{opacity:0;transform:scale(.97)}}
.zpop-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px 8px}
.zpop-h h2{margin:0;font-family:var(--display);font-size:16px}
.zpop-b{overflow-y:auto;padding:4px 16px 16px;display:grid;gap:14px}
.zgrp h3{margin:0 0 6px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.zrow{display:flex;flex-wrap:wrap;gap:6px}
.zbtn{display:inline-flex;align-items:stretch;border-radius:999px;border:1px solid var(--hair);background:var(--glass-2);overflow:hidden}
.zbtn button{border:0;background:transparent;padding:6px 12px;font-size:13.5px;transition:background .15s}
.zbtn button:hover{background:color-mix(in srgb,var(--teal) 14%,transparent)}
.zbtn .zn{font-weight:600;cursor:default}.zbtn .zn.solo{cursor:pointer}
.zbtn button+button{border-inline-start:1px solid var(--hair);color:var(--muted)}

.feed{flex:1;min-height:0;overflow-y:auto;display:none;flex-direction:column;gap:10px;padding:4px 2px 10px;overscroll-behavior:contain}
.app.m-chat .feed{display:flex}
.feed>*{flex-shrink:0}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:min(600px,94%);animation:rise .32s ease}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.msg.bot{align-self:flex-start}.msg.me{align-self:flex-end}
.av{width:28px;height:28px;border-radius:9px;background:var(--grad);flex:none;display:grid;place-items:center}
.av svg{width:14px;height:14px}
.bub{padding:10px 14px;border-radius:18px;min-width:0;overflow-wrap:anywhere}
.msg.bot .bub{border-end-start-radius:6px}
.msg.me .bub{background:var(--grad);color:#fff;border-end-end-radius:6px;box-shadow:0 8px 22px -12px rgba(30,110,200,.8)}
.bub p{margin:0 0 6px}.bub p:last-child{margin:0}
.bub ul,.bub ol{margin:4px 0 6px;padding-inline-start:20px}.bub li{margin:2px 0}
.bub strong{font-weight:700}
.bub .inline{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.sys{align-self:center;font-size:12px;color:var(--muted);padding:2px 10px;border-radius:999px;background:var(--glass)}
.typing{display:inline-flex;gap:4px;padding:4px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--soft);animation:dot 1.1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}

.card{align-self:stretch;max-width:660px;width:100%;border-radius:24px;overflow:hidden;animation:rise .4s ease}
.card-h{padding:16px 18px;color:#fff;display:flex;gap:12px;align-items:flex-start}
.card-h.red{background:var(--red-grad)}.card-h.amber{background:var(--amber-grad);color:#2B1B00}.card-h.green{background:var(--green-grad)}
.card-h>svg{width:26px;height:26px;flex:none;margin-top:2px}
.card-h h2{margin:0;font-family:var(--display);font-size:clamp(18px,3.4vw,22px);line-height:1.3;text-wrap:balance}
.card-h p{margin:4px 0 0;font-size:14px;opacity:.95}
.callrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.callbtn{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;background:#fff;color:#C62B31;font-weight:800;font-family:var(--display);text-decoration:none;font-size:16px;border:0}
.callbtn svg{width:18px;height:18px}
.ghostbtn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.2);color:inherit;border:1px solid rgba(255,255,255,.45);font-weight:700;font-size:14px}
.card-h.amber .ghostbtn{border-color:rgba(43,27,0,.25);background:rgba(255,255,255,.35)}
.ghostbtn svg{width:16px;height:16px}
.card-b{padding:16px 18px 18px;display:grid;gap:16px}
.sec h3{margin:0 0 8px;font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.02em;display:flex;align-items:center;gap:6px}
.sec h3 i{width:6px;height:6px;border-radius:50%;background:var(--teal)}
.sec.warn h3 i{background:var(--red)}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;counter-increment:s}
.steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:700;font-family:var(--display);font-size:13px}
.steps.red li::before{background:var(--red-grad)}
.plain{margin:0;padding-inline-start:18px;display:grid;gap:4px}
.why{display:flex;flex-wrap:wrap;gap:6px}
.why span{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--glass);border:1px solid var(--hair)}
.likely{font-size:14.5px}.likely small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.card-a{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--hair);background:var(--glass-2);padding:8px 14px;border-radius:999px;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn svg{width:15px;height:15px}
.btn.pri{background:var(--grad);color:#fff;border-color:transparent}
.btn.danger{background:var(--red-grad);color:#fff;border-color:transparent}
.srcline{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;border-top:1px solid var(--hair);padding-top:10px}
.srcline button{border:0;background:none;padding:0;color:var(--teal);font-weight:600;font-size:12px;text-decoration:underline;text-underline-offset:2px}

.dock{flex:none;padding-block:8px max(10px,env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:minmax(0,1fr);gap:8px;min-width:0}
.followbar{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:18px;font-size:13.5px}
.followbar span{flex:1;min-width:0}
.followbar b{font-weight:700}
.followbar .x{border:0;background:none;color:var(--muted);width:28px;height:28px;border-radius:50%}
.sugs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.sugs::-webkit-scrollbar{display:none}
.sugs:empty{display:none}
@media (min-width:760px){.sugs{flex-wrap:wrap;overflow:visible}}
.sug{flex:none;max-width:min(320px,80vw);border:1px solid var(--hair);background:color-mix(in srgb,var(--glass-2) 70%,transparent);padding:7px 13px;border-radius:14px;font-size:13.5px;color:var(--muted);text-align:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .15s,border-color .2s,transform .15s;animation:rise .3s ease both}
.sug:hover{color:var(--ink);border-color:var(--teal);transform:translateY(-1px)}
.sug.danger{color:var(--red)}
.composer{display:flex;align-items:flex-end;gap:6px;padding:6px;border-radius:26px}
.loc{display:inline-flex;align-items:center;gap:6px;flex:none;max-width:42%;height:40px;padding:0 6px 0 12px;border-radius:999px;background:var(--red-soft);color:var(--red);font-weight:600;font-size:13px}
.loc span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loc button{border:0;background:transparent;color:inherit;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none}
.loc svg{width:14px;height:14px}
@media (max-width:480px){.loc{display:none!important}}
.composer textarea{flex:1;min-width:0;resize:none;border:0;background:transparent;padding:9px 8px;height:40px;max-height:130px;line-height:1.45;outline:none}
.composer textarea::placeholder{color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mic{width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;flex:none;transition:background .2s,color .2s}
.mic:hover{background:color-mix(in srgb,var(--teal) 12%,transparent);color:var(--ink)}
.mic.on{background:var(--red-soft);color:var(--red);animation:beat 1.4s infinite}
.mic svg{width:19px;height:19px}
.send{width:44px;height:44px;border-radius:50%;border:0;background:var(--grad);color:#fff;display:grid;place-items:center;flex:none;transition:transform .15s,opacity .2s;box-shadow:0 8px 20px -8px rgba(30,110,200,.9)}
.send:hover{transform:scale(1.05)}
.send:disabled{opacity:.4;cursor:not-allowed;transform:none}
.send svg{width:19px;height:19px}
[dir="rtl"] .send svg{transform:scaleX(-1)}
.fine{margin:0;text-align:center;font-size:11.5px;color:var(--soft);line-height:1.45;text-wrap:balance}

/* panels: coach & sources */
.panel{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);background:linear-gradient(160deg,var(--bg-a),var(--bg-b));animation:rise .3s ease}
.panel-in{flex:1;min-height:0;overflow-y:auto;width:100%;max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
.panel-h{display:flex;align-items:center;gap:10px;padding-block:14px 12px;position:sticky;top:0;z-index:2;background:linear-gradient(var(--bg-a) 70%,transparent)}
.panel-h h2{margin:0;font-family:var(--display);font-size:20px;flex:1}
.panel-h p{margin:0}
.lead{color:var(--muted);margin:0 0 14px;max-width:60ch}
.tabs{display:inline-flex;padding:4px;border-radius:999px;gap:2px;margin-bottom:14px}
.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:999px;font-weight:600;font-size:13.5px;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--grad);color:#fff}
.box{border-radius:20px;padding:16px;display:grid;gap:12px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inp{flex:1;min-width:140px;border:1px solid var(--hair);background:var(--glass-2);border-radius:12px;padding:9px 12px}
.plist{display:grid;gap:8px}
.pitem{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--glass-2);border:1px solid var(--hair)}
.pitem b{font-weight:700}
.pitem small{color:var(--muted);grid-column:1/-1}
.pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;border:0}
.pill.ok{background:var(--green-soft);color:var(--green)}.pill.inj{background:var(--red-soft);color:var(--red)}.pill.rehab{background:var(--amber-soft);color:var(--amber)}
.mini{border:0;background:none;color:var(--muted);font-size:12.5px;padding:2px 6px;border-radius:8px}
.mini:hover{color:var(--red)}
.empty{color:var(--muted);text-align:center;padding:14px;font-size:14px}
.kit{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.kit label{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--glass-2);border:1px solid var(--hair);cursor:pointer}
.kit input{width:18px;height:18px;accent-color:var(--teal)}
.srcs{display:grid;gap:10px}
.src{padding:12px 14px;border-radius:16px;background:var(--glass-2);border:1px solid var(--hair)}
.src.hl{border-color:var(--teal);box-shadow:0 0 0 3px color-mix(in srgb,var(--teal) 25%,transparent)}
.src b{display:block;font-weight:700}
.src small{color:var(--muted)}
.src p{margin:6px 0 0;font-size:13.5px}
.src a{font-size:13px;overflow-wrap:anywhere}
.sel{border:1px solid var(--hair);background:var(--glass-2);border-radius:12px;padding:9px 12px;min-width:0;flex:1}

/* CPR coach */
.cpr{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:12px;padding:max(18px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(18px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:radial-gradient(120% 80% at 50% 40%,#3A0D12 0%,#14070A 70%);color:#fff;text-align:center}
.cpr h2{margin:0;font-family:var(--display);font-size:20px}
.cpr .hint{margin:4px 0 0;font-size:14px;opacity:.85;max-width:40ch}
.beatwrap{position:relative;width:min(62vw,280px);aspect-ratio:1;max-width:100%;display:grid;place-items:center}
.beat{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,#FF5A5F 0%,#C81E2B 70%);box-shadow:0 0 60px rgba(255,80,90,.55)}
.beat.push{animation:push .26s ease-out}
@keyframes push{0%{transform:scale(1)}35%{transform:scale(.86)}100%{transform:scale(1)}}
.count{position:relative;font-family:var(--display);font-weight:800;font-size:clamp(48px,14vw,86px);line-height:1}
.count small{display:block;font-size:14px;font-weight:600;opacity:.85;margin-top:4px}
.cpr ol{text-align:start;margin:0;padding-inline-start:20px;font-size:14px;opacity:.92;max-width:44ch;display:grid;gap:4px}
.cpr .row{justify-content:center}
.cpr .btn{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3)}
.cpr .btn.call{background:#fff;color:#C62B31;text-decoration:none}
.swap{font-weight:700;color:#FFD3D5;min-height:1.4em}

.toast{position:fixed;bottom:calc(120px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,10px);padding:9px 16px;border-radius:999px;background:var(--ink);color:var(--bg-a);font-weight:600;font-size:14px;opacity:0;transition:all .25s;z-index:50;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

 b_func_chest:{ar:"النفس عامل إزاي؟",en:"How is your breathing?"},
 b_bone_ankle:{ar:"اضغط بصباعك على العضمة البارزة في الكاحل من الناحيتين (حرفها من ورا وطرفها من تحت). فيه وجع جامد على العضمة نفسها؟",en:"Press with a finger on the bony bumps on both sides of the ankle (the back edge and the tip). Is there sharp pain right on the bone?"},
 b_bone_foot:{ar:"اضغط على العضمة اللي على الحرف الخارجي لنص القدم، والعضمة البارزة من جوه نص القدم. فيه وجع جامد على العضمة نفسها؟",en:"Press the bone on the outer edge of the mid-foot and the bony bump on the inner mid-foot. Is there sharp pain right on the bone?"},
 b_bone_knee:{ar:"فيه وجع جامد لما تضغط على الصابونة أو على العضمة اللي على جنب الركبة من برا، أو مش قادر تثني ركبتك لزاوية قايمة؟",en:"Is there sharp pain when you press the kneecap or the bony bump on the outer side of the knee, or can you not bend the knee to a right angle?"},
 b_tiptoe:{ar:"تقدر تقف على طراطيف صوابعك على الرجل دي لوحدها؟",en:"Can you stand on tiptoe on that leg alone?"},
 b_conc:{ar:"فيه صداع، دوخة، زغللة، أو إحساس إنك مش مركز؟",en:"Any headache, dizziness, blurred vision, or feeling foggy?"},
 b_pain:{ar:"الألم قد إيه من 10؟",en:"How bad is the pain, out of 10?"},
 b_didnt:{ar:"مش متأكد إني فهمت. ممكن تقولها بطريقة تانية؟ تقدر تضغط على أي اقتراح تحت وتعدّله.",en:"I'm not sure I got that. Could you put it another way? You can tap a suggestion below and edit it."},
 b_result:{ar:"ده تقييمي المبدئي بناءً على كلامك:",en:"Here's my first assessment based on what you told me:"},
 b_after:{ar:"لو عندك سؤال اكتبه. ولو حاجة اتغيرت أو زادت، قولّي. هسألك عليها تاني لو رجعت بكرة.",en:"Ask me anything, and tell me if something changes or gets worse. I'll check on it if you come back tomorrow."},
 b_emerg:{ar:"ده ممكن يكون خطر. ركّز معايا:",en:"This could be serious. Stay with me:"},
 b_emerg_after:{ar:"أنا معاك. قولّي اللي بيحصل دلوقتي لو محتاج خطوات أكتر.",en:"I'm here. Tell me what's happening now if you need more steps."},
 b_noanswer:{ar:"السؤال ده محتاج دكتور يجاوبه بدقة. الأهم دلوقتي إنك تمشي على الخطوات اللي في التقييم، ولو حاجة زادت أو قلقت، اكشف.",en:"That one needs a doctor to answer properly. For now, follow the steps in the assessment, and get checked if anything worsens or worries you."},
 b_ai_fail:{ar:"مقدرتش أوصل للمساعد الذكي دلوقتي.",en:"I couldn't reach the smart assistant right now."},
 b_summary:{ar:p=>"ده الملخص (اتنسخ لو الجهاز سمح):\n"+p.s,en:p=>"Here's the summary (copied if your device allowed it):\n"+p.s},
 b_cpr_offer:{ar:"افتح مساعد الضغطات: هيديك إيقاع الضغط بالصوت والصورة.",en:"Open the CPR coach — it gives you the compression rhythm with sound and a pulse."},
 b_fu_better:{ar:"كويس إنها بتتحسن. بعد أول 2–3 أيام نبدأ مرحلة **LOVE**:\n- رجّع الحركة والحِمل بالتدريج على قد ما الألم يسمح.\n- اعمل نشاط هوائي خفيف من غير ألم (عجلة، مشي) عشان الدورة الدموية.\n- تمارين تقوية وتوازن بسيطة للمكان.\n- خليك متفائل؛ الثقة بتفرق في التعافي.\nارجع للعب لما تجري وتغير اتجاه من غير ألم ولا عرج، وتحس إنك واثق.",en:"Good that it's improving. After the first 2–3 days, move to **LOVE**:\n- Bring back movement and load gradually, as pain allows.\n- Do light pain-free cardio (bike, walking) for circulation.\n- Simple strength and balance exercises for the area.\n- Stay optimistic — confidence helps recovery.\nReturn to sport when you can run and change direction without pain or limping, and you feel confident."},
 b_fu_same:{ar:"لو مفيش تحسن خالص، كمّل حماية ورفع ورباط ضاغط، وابدأ حركة خفيفة في حدود الألم. لو عدّى 5–7 أيام من غير تحسن، أو الوجع على العضمة نفسها، اكشف.",en:"If there's no change, keep protecting, elevating and compressing, and start gentle movement within pain limits. If 5–7 days pass without improvement, or the pain is right on the bone, get it checked."},
 b_fu_worse:{ar:"لو الإصابة بتسوء بدل ما تتحسن، ده سبب كافي إنك **تكشف النهارده**. ولو ظهر تنميل أو برودة أو زُرقة، أو مش قادر تدوس خالص، روح الطوارئ.",en:"If it's getting worse instead of better, that's reason enough to **see a doctor today**. If numbness, coldness, blue skin, or total inability to bear weight appears, go to the ER."},
 b_fu_head:{ar:"للخبطة في الراس، الرجوع للعب بيكون على **6 مراحل**، كل مرحلة 24 ساعة على الأقل، يعني أسبوع على الأقل، وبموافقة دكتور. لو الصداع بيزيد أو فيه ترجيع أو نعاس شديد، روح الطوارئ فوراً.",en:"After a head knock, return to sport goes through **6 stages**, each at least 24 hours — at least a week in total — with a doctor's clearance. If the headache worsens, or there's vomiting or severe drowsiness, go to the ER now."},
 b_fu_ask:{ar:"قولّي: أحسن، زي ما هي، ولا أسوأ؟",en:"Tell me: better, the same, or worse?"},

 f_unresp:{ar:"فقدان وعي أو مش بيرد",en:"Unconscious or not responding"},
 f_ko:{ar:"أغمى عليه وفاق",en:"Was knocked out, now awake"},
 f_amnesia:{ar:"مش فاكر اللي حصل",en:"Can't remember what happened"},
 f_breathing:{ar:"صعوبة في التنفس",en:"Trouble breathing"},
 f_bleeding:{ar:"نزيف شديد مش بيقف",en:"Heavy bleeding that won't stop"},
 f_deformity:{ar:"شكل المكان متغير أو عضمة باينة",en:"Visible deformity or bone showing"},
 f_numb:{ar:"تنميل، برودة، أو زُرقة",en:"Numbness, coldness or blue skin"},
 f_weakness:{ar:"ضعف أو مش قادر يحرك دراعاته أو رجليه",en:"Weakness, or can't move arms or legs"},
 f_vomit:{ar:"ترجيع",en:"Vomiting"},
 f_confusion:{ar:"لخبطة أو نعاس شديد",en:"Confusion or very drowsy"},
 f_seizure:{ar:"تشنجات",en:"Seizure"},
 f_bladder:{ar:"مش قادر يتحكم في البول أو تنميل بين الرجلين",en:"Loss of bladder control or numb groin"},
 f_bothlegs:{ar:"وجع أو تنميل في الرجلين الاتنين",en:"Pain or numbness in both legs"},
 f_coughblood:{ar:"كحة بدم",en:"Coughing blood"},
 f_highenergy:{ar:"خبطة قوية جداً (حادثة، غطس، أو وقعة من مكان عالي)",en:"High-energy hit (crash, diving, or fall from height)"},
 f_bellyhard:{ar:"بطن ناشفة أو ألم شديد بيزيد مع دوخة",en:"Rigid belly, or worsening severe pain with dizziness"},
 f_heat:{ar:"حرارة جسم عالية مع لخبطة في الجو الحر",en:"Overheated and confused in hot conditions"},
 f_sos:{ar:"إنت قلت إنها حالة طارئة",en:"You reported an emergency"},

 /* levels */
 lvl_call:{ar:"اتصل بالإسعاف 123 دلوقتي",en:"Call an ambulance now"},lvl_er:{ar:"روح الطوارئ دلوقتي",en:"Go to the emergency room now"},
 lvl_today:{ar:"اكشف النهارده",en:"See a doctor today"},lvl_soon:{ar:"اكشف خلال يوم أو اتنين",en:"See a doctor within 1–2 days"},
 lvl_home:{ar:"تقدر تبدأ الإسعاف في البيت",en:"You can start care at home"},lvl_chronic:{ar:"احجز عند أخصائي قريب",en:"Book a specialist soon"},
 sub_call:{ar:"أو خلّي حد جنبك يتصل وحط التليفون على السبيكر، وبعدها اعمل الخطوات دي لحد ما يوصلوا.",en:"Or have someone call (123 in Egypt) with the phone on speaker, then follow these steps until help arrives."},
 sub_er:{ar:"متسوقش بنفسك. لو مش هتقدر توصل بأمان، اتصل 123.",en:"Don't drive yourself. If you can't get there safely, call 123."},
 sub_today:{ar:"مش حالة إسعاف، بس محتاجة كشف وغالباً أشعة النهارده.",en:"Not an ambulance case, but it needs an exam and likely an X-ray today."},
 sub_soon:{ar:"ابدأ الخطوات دي دلوقتي واحجز كشف خلال 24–48 ساعة.",en:"Start these steps now and book an exam within 24–48 hours."},
 sub_home:{ar:"غالباً إصابة بسيطة. لو مقلّتش خلال 5–7 أيام أو زادت، اكشف.",en:"Probably minor. If it isn't better in 5–7 days, or gets worse, get checked."},
 sub_chronic:{ar:"مش طارئة، بس لو مكمّلة أكتر من أسبوعين محتاجة تقييم.",en:"Not urgent, but if it lasts beyond two weeks it needs assessment."},
 sec_area:{ar:"المكان",en:"Area"},sec_why:{ar:"ليه؟",en:"Why"},sec_do:{ar:"اعمل دلوقتي",en:"Do now"},sec_dont:{ar:"متعملش",en:"Don't"},sec_likely:{ar:"الأقرب لكلامك",en:"Closest match"},sec_watch:{ar:"اتصل 123 أو روح الطوارئ فوراً لو ظهر",en:"Call 123 or go to the ER right away if"},
 likely_note:{ar:"ده تخمين مبني على إجاباتك، الكشف بس هو اللي يأكد.",en:"An educated guess from your answers — only an examination can confirm."},

 r_ottawa:{ar:"ألم على العضمة نفسها (قواعد أوتاوا: محتاج أشعة)",en:"Pain right on the bone (Ottawa rules: X-ray needed)"},r_bone_unsure:{ar:"مش واضح لو الألم على العضمة",en:"Unclear whether the pain is on the bone"},
 r_tiptoe:{ar:"مش قادر تقف على طراطيف صوابعك",en:"Can't stand on tiptoe"},
 r_conc:{ar:"أعراض بعد خبطة في الرأس (ممكن ارتجاج)",en:"Symptoms after a head knock (possible concussion)"},
 r_pop:{ar:"طرقعة لحظة الإصابة",en:"A pop when it happened"},r_swellfast:{ar:"ورم ظهر بسرعة",en:"Swelling came on fast"},

 r_breathpain:{ar:"الألم بيزيد مع النفس",en:"Pain worse when breathing"},r_chronic:{ar:"الألم مكمّل بقاله فترة",en:"Pain has lasted a while"},
 r_minor:{ar:"مفيش علامات خطر في كلامك",en:"No warning signs in what you described"},r_headminor:{ar:"خبطة في الرأس من غير أعراض دلوقتي",en:"Head knock with no symptoms right now"},

 /* steps */
 s_call:{ar:"اتصل 123، وقول المكان بالظبط وإيه اللي حصل، وخلي التليفون على السبيكر.",en:"Call 123 (or your local number). Give the exact location and what happened, and keep the phone on speaker."},
 s_er_go:{ar:"روح أقرب طوارئ دلوقتي، ومتسوقش بنفسك.",en:"Go to the nearest ER now — don't drive yourself."},
 s_spine:{ar:"متحركش المصاب. ثبّت راسه في خط واحد مع العمود الفقري بإيديك من الجنبين، إلا لو المكان نفسه خطر.",en:"Don't move the injured person. Hold the head in line with the spine from both sides, unless the place itself is dangerous."},
 s_still:{ar:"خلّي المصاب ثابت في وضع مريح، ومتحركش المكان المصاب.",en:"Keep the person still and comfortable; don't move the injured part."},
 s_bleed:{ar:"اضغط على النزيف جامد بقماشة نضيفة. لو اتشربت حط فوقها ومتشيلهاش، وكمّل ضغط.",en:"Press firmly on the bleeding with a clean cloth. If it soaks through, add more on top — don't remove it — and keep pressing."},
 s_deform:{ar:"متحاولش ترجّع العضمة أو المفصل مكانه. سنده من فوق ومن تحت الإصابة زي ما هو بفوطة أو جاكيت.",en:"Don't try to put a bone or joint back. Support it as it is, above and below the injury, with a towel or jacket."},
 s_rings:{ar:"اقلع الخواتم والساعة من الإيد المصابة قبل ما تورم.",en:"Remove rings and watches from the injured arm before it swells."},
 s_breath:{ar:"قعّده نص قعدة لو ده مريّحه، وفك أي لبس ضيق.",en:"Sit them half-upright if that's easier, and loosen tight clothing."},
 s_unresp:{ar:"لو مش بيرد ومش بيتنفس طبيعي (أو بيشهق بس): ابدأ ضغطات قوية في نص الصدر، عمق 5–6 سم و100–120 في الدقيقة. مساعد الضغطات تحت هيديك الإيقاع.",en:"If unresponsive and not breathing normally (gasping counts as not breathing), start hard chest compressions in the centre of the chest, 5–6 cm deep at 100–120 a minute. The CPR coach below gives you the rhythm."},
 s_aed:{ar:"لو فيه جهاز صدمات (AED) قريب، ابعت حد يجيبه وشغّله فوراً واتبع تعليماته الصوتية. مش محتاج تدريب.",en:"If there's a defibrillator (AED) nearby, send someone for it, switch it on and follow its voice prompts — no training needed."},
 s_recovery:{ar:"لو بيتنفس ومش بيرد ومفيش شك في إصابة رقبة أو ضهر: نيّمه على جنبه (وضع الإفاقة) وراقب نفسه.",en:"If breathing but unresponsive, with no suspected neck or back injury, put them on their side (recovery position) and keep checking breathing."},
 s_heat_cool:{ar:"برّده فوراً قبل أي نقل: غطّسه في مية باردة لحد رقبته، أو فوط مبلولة بمية ساقعة وتلج على كل الجسم، وفي الضل.",en:"Cool them immediately, before transport: immerse in cold water up to the neck, or cover the whole body with cold wet towels and ice, in the shade."},
 s_warm:{ar:"غطيه عشان ميبردش، ومتديلوش أكل ولا شرب ولا أدوية.",en:"Keep them warm. No food, drink or medicine."},
 s_stay:{ar:"خليك جنبه وراقب نفسه ووعيه لحد ما الإسعاف يوصل.",en:"Stay with them and watch breathing and alertness until help arrives."},
 s_er_ice:{ar:"حط تلج ملفوف حوالين المكان في الطريق، من غير ضغط.",en:"On the way, hold wrapped ice around the area without pressing."},
 s_er_nofood:{ar:"متاكلش ولا تشرب لحد ما الدكتور يشوفك، ممكن تحتاج تخدير.",en:"Don't eat or drink until a doctor sees you — you may need sedation."},
 s_stop:{ar:"وقف اللعب أو المجهود دلوقتي، ومتكمّلش على الوجع.",en:"Stop playing or exercising now. Don't play through the pain."},
 s_noweight:{ar:"متدوسش على الرجل. اتسند على حد أو استخدم عكاز لحد ما تكشف.",en:"Don't put weight on it. Lean on someone or use a crutch until you're seen."},
 s_protect:{ar:"احمي المكان وقلّل الحركة اللي بتوجع لمدة يوم لـ 3 أيام، من غير راحة تامة.",en:"Protect the area and limit painful movement for 1–3 days, without complete rest."},
 s_sling:{ar:"سند الدراع على جسمك أو اعمل حمالة بإيشارب أو تيشيرت.",en:"Support the arm against your body, or make a sling from a scarf or T-shirt."},
 s_ice:{ar:"لو بيريّحك: تلج ملفوف في فوطة لحد 20 دقيقة كل 2–3 ساعات أول يومين، مش على الجلد مباشرة.",en:"If it helps: ice wrapped in a towel for up to 20 minutes every 2–3 hours for the first 2 days — never directly on skin."},
 s_compress:{ar:"اربط رباط ضاغط مش مشدود. لو حسيت تنميل أو الصوابع زرقت، فكّه.",en:"Use a firm, not tight, bandage. Loosen it if you feel tingling or the toes or fingers turn blue."},
 s_elev_leg:{ar:"ارفع رجلك على مخدة أعلى من مستوى القلب وانت قاعد أو نايم.",en:"Raise the leg on a pillow above heart level when sitting or lying."},
 s_elev_arm:{ar:"ارفع إيدك أعلى من مستوى القلب على قد ما تقدر.",en:"Keep the hand raised above heart level when you can."},
 s_conc_noplay:{ar:"متلعبش تاني النهارده حتى لو حاسس إنك كويس.",en:"No more sport today, even if you feel fine."},
 s_conc_alone:{ar:"خلّي حد بالغ معاك أول 24 ساعة يتابعك.",en:"Have a responsible adult stay with you for the first 24 hours."},
 s_conc_rest:{ar:"متسوقش، وارتاح راحة نسبية أول يوم أو يومين (نشاط يومي خفيف، شاشات أقل).",en:"Don't drive. Take relative rest for the first day or two (light daily activity, less screen time)."},
 s_head_ice:{ar:"حط تلج ملفوف على مكان الخبطة 10–15 دقيقة.",en:"Hold wrapped ice on the bump for 10–15 minutes."},
 s_neck_move:{ar:"حرك رقبتك بهدوء في حدود الألم، ومتعملش حركات مفاجئة.",en:"Move your neck gently within pain limits; avoid sudden movements."},
 s_heat_or_ice:{ar:"تلج أو كمادة دافية، اللي يريّحك أكتر (السخونية بعد أول يومين).",en:"Ice or a warm pack, whichever eases it more (heat only after the first 2 days)."},
 s_back_move:{ar:"اتحرك بهدوء ومشي خفيف؛ الراحة التامة في السرير بتأخر التحسن.",en:"Keep moving gently with short walks — bed rest slows recovery."},
 s_back_sleep:{ar:"نام على جنبك ومخدة بين ركبك لو ده مريّح.",en:"Sleep on your side with a pillow between your knees if comfortable."},
 s_rib_breath:{ar:"خد نفس عميق بهدوء كل ساعة حتى لو بيوجع شوية، عشان الرئة.",en:"Take a slow deep breath every hour even if it hurts a little — it protects your lungs."},
 s_abd_rest:{ar:"ارتاح من تمارين البطن والجري لحد ما الألم يهدى.",en:"Rest from core work and running until it settles."},
 s_load:{ar:"قلّل الحمل اللي بيوجعك (مسافة، سرعة، أوزان) بدل ما توقف خالص.",en:"Reduce the load that hurts (distance, speed, weight) rather than stopping completely."},
 s_ice_after:{ar:"تلج بعد النشاط لو بيريّحك.",en:"Ice after activity if it helps."},
 s_physio:{ar:"لو مكمّل أكتر من أسبوعين، اكشف عند أخصائي علاج طبيعي أو طبيب رياضي.",en:"If it lasts more than two weeks, see a physiotherapist or sports doctor."},
 d_heat:{ar:"متحطش حاجة سخنة، ومتعملش مساج، وابعد عن الكحول أول 2–3 أيام.",en:"No heat, massage or alcohol for the first 2–3 days."},
 d_nsaid:{ar:"بلاش مضادات الالتهاب (زي الإيبوبروفين) أول 48 ساعة إلا لو دكتور أو صيدلي قال؛ ممكن تأخر الالتئام.",en:"Avoid anti-inflammatories (like ibuprofen) for the first 48 hours unless a doctor or pharmacist advises — they may slow healing."},
 d_play:{ar:"متكمّلش لعب على الإصابة.",en:"Don't play on the injury."},
 d_meds:{ar:"متاخدش مسكن قوي أو منوم من غير ما تسأل صيدلي أو دكتور.",en:"Don't take strong painkillers or sleeping pills without asking a pharmacist or doctor."},
 d_move:{ar:"متحاولش تقعّده أو توقّفه أو تشيله.",en:"Don't try to sit them up, stand them up or carry them."},
 d_relocate:{ar:"متحاولش ترجّع حاجة مكانها.",en:"Don't try to put anything back in place."},
 d_wrap:{ar:"متربطش صدرك برباط.",en:"Don't strap your chest."},
 d_bedrest:{ar:"متفضلش في السرير طول اليوم.",en:"Don't stay in bed all day."},
 d_drive:{ar:"متسوقش لحد ما تتعافى تماماً.",en:"Don't drive until fully recovered."},

 /* FAQ answers */
 a_ice:{ar:"التلج ممكن يخفف الألم، لكن مفيش دليل قوي إنه بيسرّع الالتئام. لو بيريّحك: ملفوف في فوطة لحد 20 دقيقة كل 2–3 ساعات أول يومين، ومش على الجلد مباشرة.",en:"Ice can ease pain, but there's no strong evidence it speeds healing. If it helps: wrapped in a towel, up to 20 minutes every 2–3 hours for the first 2 days, never directly on skin."},
 a_heat:{ar:"ابعد عن السخونية أول 2–3 أيام لأنها ممكن تزود الورم. بعد كده الكمادات الدافية ممكن تريّح الشد، خصوصاً في الضهر والرقبة.",en:"Avoid heat for the first 2–3 days — it can increase swelling. After that, warmth can ease stiffness, especially in the back and neck."},
 a_meds:{ar:"اسأل صيدلي عن مسكن بسيط يناسبك (غالباً الباراسيتامول أنسب الأول)، وقوله لو عندك أمراض أو بتاخد أدوية. مضادات الالتهاب زي الإيبوبروفين الأفضل تبعد عنها أول 48 ساعة إلا لو دكتور قال. أنا مش بدي جرعات.",en:"Ask a pharmacist for a simple painkiller that suits you (paracetamol is usually the first choice), and mention any conditions or medicines. Anti-inflammatories like ibuprofen are best avoided for the first 48 hours unless a doctor advises. I don't give doses."},
 a_massage:{ar:"بلاش مساج أول 2–3 أيام. بعد كده تدليك خفيف حوالين المكان ممكن يساعد، بس مش على مكان فيه شك في كسر.",en:"No massage for the first 2–3 days. After that, gentle massage around the area can help — never over a possible fracture."},
 a_play:{ar:"ترجع للعب لما: مفيش ألم وانت بتجري وتغير اتجاه، ومفيش عرج، وقوة ومرونة الجنب المصاب قريبة من السليم، وتوازنك كويس، وتحس إنك واثق. للعضلة الخلفية لازم كمان ميكونش فيه ألم لما تضغط عليها. بعد خبطة الراس: 6 مراحل تدريجية، كل مرحلة 24 ساعة على الأقل، وبموافقة دكتور.",en:"Return when: no pain when running and cutting, no limp, strength and flexibility close to the other side, good balance, and you feel confident. For a hamstring, it should also not hurt when pressed. After a head knock: 6 graduated stages, each at least 24 hours, with a doctor's clearance."},
 a_bandage:{ar:"رباط ضاغط مش مشدود بيقلل الورم. ابدأ من بعيد عن القلب وطلّع لفوق، وفكّه لو حسيت تنميل أو اللون اتغير، وشيله وانت نايم.",en:"A firm, not tight, bandage reduces swelling. Wrap from further away toward the heart, loosen it if there's tingling or colour change, and take it off to sleep."},
 a_doctor:{ar:"اكشف لو: مش قادر تدوس وتمشي 4 خطوات، أو فيه وجع على العضمة نفسها، أو ورم شديد، أو مفيش تحسن خلال 5–7 أيام. طبيب عظام أو طب رياضي هو الأنسب، وهو اللي يقرر الأشعة.",en:"Get checked if you can't bear weight for 4 steps, there's pain right on the bone, heavy swelling, or no improvement in 5–7 days. An orthopaedic or sports doctor is best, and they'll decide on X-rays."},
 a_walk:{ar:"اتحرك في حدود الألم. لو المشي بيوجع جامد أو بتعرج، قلّله واستخدم سند. الحركة الخفيفة بتساعد التعافي أكتر من الراحة التامة.",en:"Move within pain limits. If walking hurts a lot or you limp, cut back and use support. Gentle movement helps recovery more than complete rest."},
 a_cpr:{ar:"**لو مش بيرد ومش بيتنفس طبيعي:**\n1. اتأكد إن حد اتصل 123 وخلي التليفون على السبيكر.\n2. كعب إيدك في نص الصدر والإيد التانية فوقها، ودراعاتك مفرودة.\n3. اضغط 5–6 سم بسرعة 100–120 في الدقيقة، وسيب الصدر يرجع كامل.\n4. لو مش متدرب: ضغطات بس من غير نفخ.\n5. متوقفش لحد ما الإسعاف يوصل أو يبدأ يتنفس طبيعي.",en:"**If unresponsive and not breathing normally:**\n1. Make sure someone has called emergency services; phone on speaker.\n2. Heel of your hand in the centre of the chest, other hand on top, arms straight.\n3. Push 5–6 cm deep at 100–120 a minute, letting the chest fully rise.\n4. If you're not trained: compressions only, no breaths.\n5. Don't stop until help arrives or they start breathing normally."},
 a_recovery:{ar:"**لو بيتنفس بس مش بيرد:**\n1. لو مفيش شك في إصابة رقبة أو ضهر، نيّمه على جنبه وراسه مايلة لورا شوية عشان النفس يفضل مفتوح.\n2. لو فيه شك في الرقبة، سيبه زي ما هو وثبّت راسه في خط واحد مع جسمه.\n3. راقب نفسه باستمرار، ولو وقف ابدأ ضغطات الصدر.",en:"**If breathing but not responding:**\n1. If there's no suspected neck or back injury, roll them onto their side with the head tilted slightly back.\n2. If a neck injury is possible, leave them as they are and keep the head in line with the body.\n3. Keep checking breathing; if it stops, start chest compressions."},
 a_bleed:{ar:"**للنزيف:**\n1. اضغط مباشرة وجامد على الجرح بقماشة نضيفة.\n2. لو اتشربت، حط فوقها ومتشيلهاش.\n3. لو الدم بيغرّق رباط ورا رباط، ده نزيف خطير: اتصل 123 واتبع تعليماتهم (ممكن يقولولك تعمل رباط ضاغط فوق الجرح).\n4. كمّل ضغط لحد ما الإسعاف يوصل.",en:"**For bleeding:**\n1. Press directly and firmly on the wound with a clean cloth.\n2. If it soaks through, add more on top — don't remove it.\n3. If blood soaks dressing after dressing, it's life-threatening: call emergency services and follow their instructions (they may guide you to apply a tourniquet above the wound).\n4. Keep pressing until help arrives."},
 a_late:{ar:"اتصل تاني بـ 123 وقولهم إن الحالة مستمرة أو اتغيرت. لو المصاب بيتنفس ومفيش شك في إصابة رقبة أو ضهر، وفيه حد يقدر يوصله بأمان، ممكن تتحركوا لأقرب طوارئ. لو مش متأكد، استنى ونفذ تعليمات الإسعاف.",en:"Call emergency services again and tell them the situation continues or has changed. If the person is breathing, there's no suspected neck or back injury and someone can drive safely, you may go to the nearest ER. If unsure, wait and follow the dispatcher's instructions."},
 a_immob:{ar:"ثبّت المكان زي ما هو: سنده من فوق ومن تحت الإصابة بفوطة أو جاكيت، وحط حاجة ناشفة (كرتونة، مجلة) على الجنبين لو تقدر من غير ما تشده. للدراع اعمل حمالة. للرجل اربطها برفق في الرجل السليمة بقماش.",en:"Keep it as it is: support above and below the injury with a towel or jacket, and add something stiff (cardboard, a magazine) on both sides if you can, without pulling it. For an arm, use a sling. For a leg, gently tie it to the healthy leg with cloth."},
 a_heatstroke:{ar:"**ضربة الحر:** برّده فوراً قبل النقل: غطّسه في مية باردة لحد رقبته حوالي 15 دقيقة أو لحد ما يفوق، أو فوط مبلولة ساقعة وتلج على كل الجسم في الضل، واتصل 123.",en:"**Heat stroke:** cool first, transport second — immerse in cold water up to the neck for about 15 minutes or until they're alert, or cover the whole body with cold wet towels and ice in the shade, and call emergency services."},

const NEG=/((^|\s)(مفيش|مافيش|ما فيش|مش|مفيهاش|مفيهوش|بدون|من غير|ولا|لا|no|not|without|never|none|zero)|n't)\s+(\S+\s+)?$/;
const SELFNEG=/^(مش|مفيش|مقدرش|can'?t|cannot|not|unable|no )/;
function has(text,re){
 const g=new RegExp(re.source,"g");let m;
 while((m=g.exec(text))){
  if(SELFNEG.test(m[0]))return true;
  const st=Math.max(0,m.index-26);let before=text.slice(st,m.index);if(st>0)before=before.replace(/^\S*\s?/,"");
  if(!NEG.test(before))return true;
  if(m.index===g.lastIndex)g.lastIndex++;
 }
 return false;
}

function assess(){
 const f=S.f,c=cat(),z=S.zone,R=[];let level=null;
 const up=(l,r)=>{if(!level||RANK[l]>RANK[level])level=l;if(r&&!R.some(x=>x.r===r))R.push({r,l})};
 if(S.sos)up("call","f_sos");
 f.flags.forEach(fl=>{const r=flagRule(fl,c);if(r)up(r,"f_"+fl)});
 if(f.func==="no"){if(c==="lower")up("today","r_noweight");else if(c==="upper")up("today","r_nouse");else if(c==="back"||c==="neck")up("today","r_nomove")}
 if(c==="chest"&&f.func==="hurt")up("soon","r_breathpain");
 if(f.bone===true)up("today","r_ottawa");else if(f.bone==="unsure")up("soon","r_bone_unsure");
 if(f.tiptoe===false)up("today","r_tiptoe");
 if(c==="head"&&f.conc===true)up("today","r_conc");
 if(f.sym.has("kick")&&(z==="achilles"||z==="calf"))up("today","r_kick");
 if(f.sym.has("lock")&&z==="knee")up("today","r_lock");
 if(z==="wrist"&&f.mech==="fall")up("soon","r_wristfall");
 if(f.pop===true)up("soon","r_pop");
 if(f.swell==="fast")up("soon","r_swellfast");
 if(f.sym.has("give"))up("soon","r_give");
 if(f.pain!=null&&f.pain>=9)up("today","r_pain9");else if(f.pain!=null&&f.pain>=7)up("soon","r_pain7");
 if(!level&&!acute())up("chronic","r_chronic");
 if(!level)up("home",c==="head"?"r_headminor":"r_minor");
 const reasons=R.filter(x=>x.l===level||RANK[x.l]>=RANK.soon).sort((a,b)=>RANK[b.l]-RANK[a.l]).map(x=>x.r).slice(0,4);
 const A={level,reasons,zone:z,side:S.side,cat:c,flags:[...f.flags],sos:S.sos,date:Date.now()};
 A.color=(level==="call"||level==="er")?"red":(level==="today"||level==="soon")?"amber":"green";
 buildSteps(A);A.likely=likely(A);A.src=sourcesFor(A);
 return A;
}
function buildSteps(A){
 const f=S.f,c=A.cat,fl=f.flags;let s=[],d=[],w=[];
 const spine=c==="head"||c==="neck"||c==="back"||fl.has("highenergy");
 if(A.level==="call"){
  s=["s_call"];
  if(fl.has("heat"))s.push("s_heat_cool");
  s.push(spine?"s_spine":"s_still");
  if(fl.has("bleeding"))s.push("s_bleed");
  if(fl.has("deformity"))s.push("s_deform");
  if((c==="chest"||fl.has("breathing"))&&!spine)s.push("s_breath");
  if(fl.has("unresp")||S.sos||c==="none"){s.push("s_unresp","s_aed");if(!spine)s.push("s_recovery")}
  s.push("s_warm","s_stay");
  d=spine?["d_move"]:[];if(fl.has("deformity"))d.push("d_relocate");
 }else if(A.level==="er"){
  s=["s_er_go"];

  if(c==="upper")s.push("s_rings");

  s=["s_load","s_ice_after","s_physio"];d=["d_play"];
 }else{
  switch(c){
   case "lower":s=["s_stop",(f.func==="no"||A.level==="today")?"s_noweight":"s_protect","s_ice","s_compress","s_elev_leg"];d=["d_heat","d_nsaid","d_play"];break;
   case "upper":s=["s_stop","s_sling","s_rings","s_ice","s_elev_arm"];d=["d_heat","d_nsaid","d_play"];break;
   case "head":s=A.level==="home"?["s_conc_noplay","s_head_ice","s_conc_alone"]:["s_conc_noplay","s_conc_alone","s_conc_rest","s_head_ice"];d=["d_drive","d_meds"];break;
   case "neck":s=["s_stop","s_neck_move","s_heat_or_ice"];d=["d_play"];break;
   case "back":s=["s_back_move","s_heat_or_ice","s_back_sleep"];d=["d_bedrest"];break;
   case "chest":s=["s_stop","s_ice","s_rib_breath"];d=["d_wrap","d_nsaid","d_play"];break;
   case "abdomen":s=["s_stop","s_ice","s_abd_rest"];d=["d_play"];break;
   default:s=["s_stop","s_ice"];d=["d_play"];
  }
 }
 w=({lower:["w_noweight","w_numb_leg","w_swellworse","w_deform"],upper:["w_nouse","w_numb_arm","w_swellworse","w_deform"],head:["w_vomit","w_headache","w_drowsy","w_confused","w_seizure","w_weak","w_pupil","w_fluid"],neck:["w_weak","w_neckpain","w_sob"],back:["w_bladder","w_numb_saddle","w_weak_leg"],chest:["w_sob","w_coughblood","w_chestworse"],abdomen:["w_spleen","w_bellyworse","w_vomit","w_urineblood"]})[c]||["w_sob","w_bleed","w_drowsy"];
 A.steps=s;A.donts=d;A.watch=(A.level==="call")?[]:w;
 A.cpr=A.level==="call"&&(fl.has("unresp")||S.sos||c==="none");

function sourcesFor(A){
 const c=A.cat,z=A.zone,fl=new Set(A.flags),out=[];const p=k=>{if(!out.includes(k))out.push(k)};
 if(A.level==="call"){p("rcuk");p("ahafa");if(c==="head"||c==="neck"||c==="back"||fl.has("highenergy"))p("sjaspine");if(fl.has("bleeding"))p("sjableed");if(fl.has("heat"))p("heat");p("egypt")}
 if(A.level==="er"&&(fl.has("deformity")||c==="upper"||c==="lower")){p("brc");p("nhsfx")}
 if(c==="head"){p("nicehead");p("nhshead");p("cdc");p("cisg")}
 if(c==="neck")p("nicespine");
 if(c==="back")p("ces");
 if(c==="chest")p("ribs");
 if(c==="abdomen")p("spleen");
 if(c==="lower"||c==="upper"){if(A.level!=="call"){p("peace");p("nhssprain")}if(["ankle","foot","knee"].includes(z))p("ottawa");if(z==="ankle")p("paass")}
 if(z==="achilles"||z==="calf")p("achilles");
 if(z==="wrist")p("scaphoid");
 if(z==="hamstring")p("nidirect");
 return out.slice(0,6);
}
function likely(A){
 if(!A.zone||A.level==="call")return[];
 const f=S.f,list=CONDS[A.zone]||[],ch=!acute();
 const sc=list.map(([ar,en,x],i)=>{
  let s=1;
  if(f.mech&&f.mech!=="unknown")s+=x.m.includes(f.mech)?3:-1;
  if(f.pop===true)s+=x.pop?2:-.5;
  if(f.swell==="fast")s+=x.sw?2:0;
  if(ch)s+=x.ch?3:-2;else if(x.ch)s-=2;
  if(f.func==="no")s+=x.nw?1.5:0;
  if(f.bone===true)s+=x.bone?3:0;
  if(f.tiptoe===false)s+=x.tip?4:0;
  if(f.flags.has("deformity"))s+=x.def?4:-1;else if(x.def)s-=1.5;
  if(f.sym.has("kick"))s+=x.kick?4:0;
  if(f.sym.has("lock"))s+=x.lock?3:0;
  if(f.flags.has("numb"))s+=x.numb?2:0;
  if(x.conc)s+=f.conc?3:-1;
  return{i,s};
 }).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);
 return sc.slice(0,sc.length>1&&sc[0].s-sc[1].s>=3?1:2).map(x=>x.i);
}

 const camera=new TH.PerspectiveCamera(28,1,.05,40);camera.position.set(0,.9,4.4);

 controls.rotateSpeed=.85;controls.zoomSpeed=.8;controls.minPolarAngle=Math.PI*.22;controls.maxPolarAngle=Math.PI*.72;
 controls.autoRotate=!REDUCE;controls.autoRotateSpeed=1.1;

 const key=new TH.DirectionalLight(0xffffff,1.05);key.position.set(1.6,3,2.6);scene.add(key);
 const fill=new TH.DirectionalLight(0xe2f2ff,.3);fill.position.set(-2.2,1.4,1.2);scene.add(fill);
 const rim1=new TH.DirectionalLight(0x5ee6d6,.75);rim1.position.set(-1.6,2,-2.6);scene.add(rim1);
